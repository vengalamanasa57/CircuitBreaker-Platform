server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  instance:
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    register-with-eureka: false     # this IS the registry; it does not register with itself
    fetch-registry: false
  server:
    # Demo-tuned so that a killed service disappears from the registry within seconds.
    # In production keep self-preservation ON and use the default (slower) eviction timers.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
